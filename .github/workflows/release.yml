name: Release (tag)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"        # например v1.0.0
          VERSION="${TAG#v}"              # 1.0.0
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 1) Тесты
      - name: Run tests
        run: ./mvnw -B test

      # 2) Постановка версии в pom.xml
      - name: Set Maven project version
        run: |
          ./mvnw -B versions:set -DnewVersion=${{ steps.ver.outputs.version }} -DgenerateBackupPoms=false
          ./mvnw -B -DskipTests package

      # 3) jar
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          JAR=$(ls target/*.jar | grep -vE '(sources|javadoc)\.jar$' | head -n 1)
          echo "Using JAR: $JAR"
          cp "$JAR" dist/budget-tracker-${{ steps.ver.outputs.version }}.jar

          # checksums (опционально, но красиво)
          cd dist
          sha256sum *.jar > SHA256SUMS.txt

      # 4) GitHub Release + jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt